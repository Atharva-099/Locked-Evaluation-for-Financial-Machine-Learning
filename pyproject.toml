[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p3-modellab"
version = "0.1.0"
description = "Compare ML models on WRDS prediction tasks and find where they beat or fail a strong baseline."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=2.0",
    "pyarrow>=15",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "xgboost>=3.0",
    "catboost>=1.2",
    "joblib>=1.3",
    "plotly>=5.0",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["p3_modellab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
